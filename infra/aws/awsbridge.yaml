AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  awsbridge - IAM OIDC provider (issuer = awsbridge Worker) and two roles that
  the Worker-issued JWT can assume with sts:AssumeRoleWithWebIdentity:
  a read-only role (FederatedAwsBridgeMcpViewer) and a debug role (FederatedAwsBridgeMcpDebugger).

# Role layout (see docs/specs/architecture.md "ロール構成"):
#
#   ReadOnlyRole  AWS managed ReadOnlyAccess + an inline explicit Deny on reading secret values (see below).
#   DebugRole     ReadOnlyAccess + an inline policy in groups (Investigation / Operations /
#                 CostIncurring / Execution, all Allows gated by aws:CalledViaAWSMCP,
#                 plus the same Deny on reading secret values)
#                 (+ optional extra managed policies via DebugAdditionalPolicyArns).
#
# These MCP roles are separate from the human console roles (Viewer / Administrator,
# see docs/specs/console-login.md section 2.3). Granting a person a console role does not change what these
# roles can do. Everyone can use the read-only role (Viewer). Who gets the debug role (Debugger) is decided
# by the downstream configuration (DebugAllowedSubjects); there is no upstream rule. Note when granting it:
# its remote shells get the target role's permissions, which carry no MCP-only condition.
#
# WARNING (both roles): secret values cannot be read directly through the API.
# - Both roles explicitly deny, with no condition, ssm:GetParameter, GetParameters, GetParametersByPath,
#   GetParameterHistory, secretsmanager:GetSecretValue and BatchGetSecretValue. The Deny applies whether
#   or not the call goes through the AWS MCP server, and also overrides any Allow in managed policies
#   added with DebugAdditionalPolicyArns. ReadOnlyAccess (v191) includes ssm:Get* (SecureString values are
#   decryptable through SSM with the aws/ssm key), so without the Deny it could read SSM parameters.
#   ReadOnlyAccess does not include secretsmanager:GetSecretValue or kms:Decrypt; no kms:Decrypt is granted.
# - Residual paths: this is not "cannot read secrets". Secrets can still be reached through
#   remote shells (debug role: SSM SendCommand / StartSession, ECS Exec, EC2 Instance Connect run with the
#   instance or task role's permissions, which may read secrets), SSM command / Automation output,
#   Lambda function environment variables and code URLs (lambda:Get*), plaintext task definition and
#   CodeBuild project environment variables, EC2 user data, CloudFormation templates and outputs, AppConfig
#   configuration content, S3 objects (s3:GetObject), logs, and rds-db:connect (debug role). They are used daily for investigation, so they are NOT denied
#   here. If secrets live there, narrow the allowed subjects or add your own Deny (e.g. through a
#   permissions boundary or an SCP).
#
# Users are scoped per role: AllowedSubjects (read-only) and DebugAllowedSubjects (debug).
#
# WARNING (DebugRole):
# - ReadOnlyAccess is NOT restricted to the AWS MCP path. AWS managed policies cannot carry
#   IAM conditions, so its read permissions apply even to direct API calls with the session.
#   Only the Allows in the inline policy below are gated by aws:CalledViaAWSMCP.
# - The inline policy grants remote-execution-equivalent permissions: ssm:SendCommand and
#   ecs:ExecuteCommand are equivalent to a remote shell (secrets, credentials and files can
#   be exposed); lambda:InvokeFunction runs business logic that may have side effects.
#   CostIncurring actions are billed, and codepipeline:RetryStageExecution can run deployments.
# - iam:PassRole is not granted unless DebugPassableEcsTaskRoleArns / DebugPassableBedrockServiceRoleArns list
#   specific roles (empty by default). lambda:UpdateFunctionConfiguration / autoscaling:UpdateAutoScalingGroup
#   (which can swap in a more privileged execution role / launch template) are not granted. This does NOT
#   make the role escalation-proof: the remote shells below remain.
#   Remaining risk: SSM SendCommand / StartSession, ECS Exec and EC2 Instance Connect run with the
#   instance or task role's permissions. Restrict them by tags or SSM documents in production.
# - Jobs that keep running: Bedrock evaluation jobs (CreateEvaluationJob), batch inference
#   (CreateModelInvocationJob), Advanced Prompt Optimization (CreateAdvancedPromptOptimizationJob) and
#   Transcribe jobs (StartTranscriptionJob) continue after the session ends and are billed. Stopping them
#   needs StopEvaluationJob / StopModelInvocationJob / StopAdvancedPromptOptimizationJob (all granted).
#   The Stop actions use Resource "*", so they can also stop jobs that other people started, not only the
#   jobs this session created. Stopping a job does not refund the cost already incurred.
#   Transcribe has no stop operation (only DeleteTranscriptionJob, which is NOT granted), so a started
#   transcription job cannot be stopped from here.
# - What can be passed to a Bedrock job is "the roles listed in DebugPassableBedrockServiceRoleArns x the
#   Create operations allowed here" (CreateEvaluationJob, CreateModelInvocationJob), and it is decided by the
#   role's effective permissions, including anything added with DebugAdditionalPolicyArns and any Bedrock
#   operation added in the future.
#   Evaluation jobs and batch inference run with the passed service role's permissions, so through that role
#   they can read data the debug role cannot read directly and write to any output location the role allows.
#   The debug role's Deny on secret reads (SSM parameters / Secrets Manager) is NOT inherited by the service
#   role. So make every listed role dedicated to those jobs and least-privilege (limit the input and output
#   prefixes, the models and KMS), and do NOT list an existing role with broad permissions.
#   In the trust policy, use aws:SourceAccount and, where supported, aws:SourceArn too (confirm that the
#   key is provided for that job type). aws:SourceAccount is a confused-deputy countermeasure only; it does
#   not narrow what the service role itself can do, which must be limited separately.
#   Transcribe DataAccessRoleArn needs iam:PassRole to transcribe.amazonaws.com, which is NOT granted, so
#   that form cannot be used.
# - No S3 write is granted to the debug role itself (no s3:PutObject); that statement is about the debug role
#   only. Consequences for the jobs above (all NOT measured yet):
#   * Evaluation jobs and batch inference read and write S3 with the passed service role, so this role needs
#     no S3 write; the service role's own S3 permissions are not limited by this (see above). Putting the input dataset into S3 must be done by other means (another role).
#   * Advanced Prompt Optimization uses the calling identity's permissions (Forward Access Session) for S3
#     and models; the AWS docs (advanced-prompt-optimization-prereqs) say the calling identity needs read
#     access to the input and write access to the output location. So it is expected to FAIL to write the
#     output with this role alone (actual behavior NOT measured). If you add s3:PutObject with
#     DebugAdditionalPolicyArns, note that an additional managed policy does NOT automatically get the inline
#     policy's MCP condition: limit it to the output bucket / prefix and add the aws:CalledViaAWSMCP condition
#     yourself. The permissions it really needs are NOT measured and may include more than writing the output.
#   * Transcribe with OutputBucketName is expected to write with the caller's permissions (the AWS docs
#     "Permissions required for IAM roles" describe the IAM entity that makes the request needing
#     s3:PutObject on the output bucket; whose identity is used is NOT confirmed). Without OutputBucketName
#     the transcript goes to a service-managed bucket and no write permission is needed.
# - NOT measured yet: whether aws:CalledViaAWSMCP is attached to the downstream calls made with the
#   caller's permissions (Forward Access Session) by Advanced Prompt Optimization and Transcribe; global
#   inference profiles; creating a job that needs iam:PassRole.
# - Resource "*" is simplified. In production, scope it to specific ARNs, tags or SSM
#   documents, and enable session logging (SSM Session Manager logs to S3/CloudWatch Logs,
#   ECS Exec logging in the task definition, Lambda function logs). CloudTrail alone is not enough.

Parameters:
  IssuerHost:
    Type: String
    Description: OIDC issuer host name without scheme or trailing slash (e.g. awsbridge-oidc-mcp.example.com; awsbridge-dev.example.workers.dev for a workers.dev trial).
    AllowedPattern: "^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$"
    ConstraintDescription: Host name only. Do not include https:// or a trailing slash.
  Audience:
    Type: String
    Default: awsbridge
    Description: Audience (aud) of the Worker-issued JWT. Also used as the OIDC client ID.
    AllowedPattern: "^[A-Za-z0-9._:-]+$"
  AllowedSubjects:
    Type: CommaDelimitedList
    Description: >-
      Users (JWT sub = email) allowed to assume the read-only role, comma separated.
      Wildcards allowed in the local part only (e.g. user@example.com,*@example.org).
    AllowedPattern: '^[A-Za-z0-9._%+*?-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'
    ConstraintDescription: Each entry must look like user@example.com or *@example.com. A bare * or a wildcard in the domain is not allowed.
  DebugAllowedSubjects:
    Type: CommaDelimitedList
    Description: >-
      Users (JWT sub = email) allowed to assume the debug role, comma separated.
      The debug role can run commands remotely, so keep this narrower than AllowedSubjects.
    AllowedPattern: '^[A-Za-z0-9._%+*?-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'
    ConstraintDescription: Each entry must look like user@example.com or *@example.com. A bare * or a wildcard in the domain is not allowed.
  ReadOnlyRoleName:
    Type: String
    Default: FederatedAwsBridgeMcpViewer
    Description: Name of the read-only IAM role.
    AllowedPattern: '^[\w+=,.@-]{1,64}$'
    ConstraintDescription: 1-64 characters of alphanumerics and _+=,.@-
  DebugRoleName:
    Type: String
    Default: FederatedAwsBridgeMcpDebugger
    Description: Name of the debug IAM role.
    AllowedPattern: '^[\w+=,.@-]{1,64}$'
    ConstraintDescription: 1-64 characters of alphanumerics and _+=,.@-
  DebugAdditionalPolicyArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Extra managed policy ARNs to attach to the debug role in addition to ReadOnlyAccess
      and the inline policy, comma separated. Empty means none.
    AllowedPattern: '^(arn:aws[a-z-]*:iam::(aws|\d{12}):policy/[\w+=,.@/-]+)?$'
    ConstraintDescription: Each entry must be an IAM managed policy ARN (arn:aws:iam::aws:policy/... or arn:aws:iam::<account>:policy/...).
  DebugPassableEcsTaskRoleArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      IAM role ARNs that the debug role may pass to ECS tasks with ecs:RunTask (iam:PassRole,
      only to ecs-tasks.amazonaws.com), comma separated. Empty means iam:PassRole is not granted
      (ecs:RunTask then works only for task definitions without a task role).
    AllowedPattern: '^(arn:aws[a-z-]*:iam::\d{12}:role/[\w+=,.@/-]+)?$'
    ConstraintDescription: Each entry must be an IAM role ARN (arn:aws:iam::<account>:role/...). Wildcards are not allowed.
  DebugPassableBedrockServiceRoleArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      IAM role ARNs that the debug role may pass to Bedrock evaluation jobs and batch inference jobs
      (bedrock:CreateEvaluationJob / CreateModelInvocationJob; iam:PassRole, only to bedrock.amazonaws.com),
      comma separated. Empty means iam:PassRole for Bedrock is not granted. List roles dedicated to those
      jobs only, and add aws:SourceAccount to their trust policies.
    AllowedPattern: '^(arn:aws[a-z-]*:iam::\d{12}:role/[\w+=,.@/-]+)?$'
    ConstraintDescription: Each entry must be an IAM role ARN (arn:aws:iam::<account>:role/...). Wildcards are not allowed.
  MaxSessionDuration:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
    Description: Maximum session duration of the roles in seconds.

Conditions:
  HasDebugAdditionalPolicies:
    Fn::Not:
      - Fn::Equals:
          - Fn::Join: ["", { Ref: DebugAdditionalPolicyArns }]
          - ""

  HasDebugPassableEcsTaskRoles:
    Fn::Not:
      - Fn::Equals:
          - Fn::Join: ["", { Ref: DebugPassableEcsTaskRoleArns }]
          - ""

  HasDebugPassableBedrockServiceRoles:
    Fn::Not:
      - Fn::Equals:
          - Fn::Join: ["", { Ref: DebugPassableBedrockServiceRoleArns }]
          - ""

Resources:
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url:
        Fn::Sub: "https://${IssuerHost}"
      ClientIdList:
        - Ref: Audience
      Tags:
        - Key: project
          Value: awsbridge

  ReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: ReadOnlyRoleName
      MaxSessionDuration:
        Ref: MaxSessionDuration
      ManagedPolicyArns:
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
      Policies:
        - PolicyName: DenySecretValueRead
          PolicyDocument:
            Version: "2012-10-17"
            # Same Deny as in DebugRole (no condition). See the warning at the top.
            Statement:
              - Sid: DenySsmParameterRead
                Effect: Deny
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:GetParameterHistory
                Resource: "*"
              - Sid: DenySecretsManagerRead
                Effect: Deny
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:BatchGetSecretValue
                Resource: "*"
      # The condition keys contain the issuer host, and CloudFormation cannot use
      # intrinsic functions in mapping keys, so the policy is built as a JSON string.
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |-
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": { "Federated": "${OidcProvider}" },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": { "${IssuerHost}:aud": "${Audience}" },
                    "StringLike": { "${IssuerHost}:sub": ["${SubjectList}"] }
                  }
                }
              ]
            }
          - SubjectList:
              Fn::Join:
                - '","'
                - Ref: AllowedSubjects
      Tags:
        - Key: project
          Value: awsbridge

  DebugRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: DebugRoleName
      MaxSessionDuration:
        Ref: MaxSessionDuration
      # ReadOnlyAccess, plus DebugAdditionalPolicyArns when given.
      # CloudFormation has no list concatenation, so build one comma-separated string and split it.
      ManagedPolicyArns:
        Fn::If:
          - HasDebugAdditionalPolicies
          - Fn::Split:
              - ","
              - Fn::Sub:
                  - "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess,${Additional}"
                  - Additional:
                      Fn::Join: [",", { Ref: DebugAdditionalPolicyArns }]
          - - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |-
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": { "Federated": "${OidcProvider}" },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": { "${IssuerHost}:aud": "${Audience}" },
                    "StringLike": { "${IssuerHost}:sub": ["${SubjectList}"] }
                  }
                }
              ]
            }
          - SubjectList:
              Fn::Join:
                - '","'
                - Ref: DebugAllowedSubjects
      Policies:
        - PolicyName: OperationalAccessViaMCP
          PolicyDocument:
            Version: "2012-10-17"
            # Every Allow statement is gated by aws:CalledViaAWSMCP. Keep it that way when adding Actions,
            # and prefer narrowing Resource over adding broad Actions. No delete, IAM-write or
            # organizations actions here (a Knowledge Base sync in Operations can still remove indexed
            # documents; see there). List actions one by one (no wildcards).
            # Inline policy size limit is 10,240 characters.
            Statement:
              # Investigation: deeper read access than ReadOnlyAccess (queries, traces, live tail, console output, Config).
              # Athena also needs s3:PutObject on its result bucket; that is intentionally NOT granted here.
              # Add it with DebugAdditionalPolicyArns when needed.
              - Sid: Investigation
                Effect: Allow
                Action:
                  - logs:StartQuery
                  - logs:StopQuery
                  - logs:GetQueryResults
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:GetLogRecord
                  - logs:StartLiveTail
                  - xray:GetTraceSummaries
                  - xray:BatchGetTraces
                  - xray:GetInsightSummaries
                  - cloudtrail:LookupEvents
                  - cloudtrail:StartQuery
                  - cloudtrail:GetQueryResults
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                  - ec2:GetConsoleOutput
                  - ec2:GetConsoleScreenshot
                  - config:SelectResourceConfig
                  - config:GetResourceConfigHistory
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:CalledViaAWSMCP": aws-mcp.amazonaws.com
              # DenySsmParameterRead / DenySecretsManagerRead: secret values cannot be read through the API, even
              # through AWS MCP (no condition). Also overrides Allows from DebugAdditionalPolicyArns.
              # ReadOnlyAccess includes ssm:Get* (SecureString with aws/ssm decrypts via the key policy).
              # Do not add a condition here, and do not grant secretsmanager:GetSecretValue or kms:Decrypt.
              - Sid: DenySsmParameterRead
                Effect: Deny
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:GetParameterHistory
                Resource: "*"
              - Sid: DenySecretsManagerRead
                Effect: Deny
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:BatchGetSecretValue
                Resource: "*"
              # Operations: light, reversible-ish operational actions with side effects. No delete actions.
              # Exception in effect: bedrock:StartIngestionJob syncs a Knowledge Base data source, and documents
              # removed from the source (e.g. S3) are removed from the vector store too. Resource stays "*"
              # like the other groups; to limit it, edit Resource to knowledge-base ARNs
              # (arn:${Partition}:bedrock:${Region}:${Account}:knowledge-base/${KnowledgeBaseId}) or use aws:ResourceTag.
              - Sid: Operations
                Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:StopTask
                  - ec2:RebootInstances
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - lambda:PutFunctionConcurrency
                  - autoscaling:SetDesiredCapacity
                  - rds:RebootDBInstance
                  - elasticache:RebootCacheCluster
                  - cloudfront:CreateInvalidation
                  - bedrock:StartIngestionJob
                  - bedrock:StopIngestionJob
                  # Stop / restart / fail over.
                  - states:StopExecution
                  - glue:BatchStopJobRun
                  - glue:StopCrawler
                  - codebuild:RetryBuild
                  - codebuild:StopBuild
                  - autoscaling:SuspendProcesses
                  - autoscaling:ResumeProcesses
                  - rds:FailoverDBCluster
                  - rds:RebootDBCluster
                  - elasticache:TestFailover
                  - elasticbeanstalk:RestartAppServer
                  # Stop or suppress. Forgetting to undo these hides incidents (alarm actions, rules) or
                  # disables self-healing; SetInstanceHealth Unhealthy terminates and replaces the instance.
                  - cloudwatch:DisableAlarmActions
                  - cloudwatch:EnableAlarmActions
                  - events:EnableRule
                  - events:DisableRule
                  - events:CancelReplay
                  - autoscaling:SetInstanceHealth
                  - autoscaling:EnterStandby
                  - autoscaling:ExitStandby
                  - rds:StartDBInstance
                  - rds:StopDBInstance
                  - rds:StartDBCluster
                  - rds:StopDBCluster
                  - ssm:StopAutomationExecution
                  - batch:CancelJob
                  - codepipeline:StopPipelineExecution
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:CalledViaAWSMCP": aws-mcp.amazonaws.com
              # CostIncurring: actions whose main side effect is cost (model / endpoint inference, snapshots,
              # provisioned concurrency, Bedrock evaluation / batch inference / prompt optimization jobs, Transcribe).
              # No snapshot sharing (ModifyDBSnapshotAttribute etc.) is granted.
              # Evaluation, batch inference, Advanced Prompt Optimization and Transcribe jobs keep running after the
              # session ends and are billed, so their Stop actions are here too (Transcribe has no stop operation).
              # CreateEvaluationJob / CreateModelInvocationJob need iam:PassRole (PassRoleForBedrockJobs below).
              # The Stop actions use Resource "*": they can stop other people's jobs too. Stopping does not refund
              # the cost already incurred.
              # Transcribe DataAccessRoleArn needs iam:PassRole to transcribe.amazonaws.com, which is NOT granted.
              - Sid: CostIncurring
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ApplyGuardrail
                  - bedrock:RetrieveAndGenerate
                  - sagemaker:InvokeEndpoint
                  - sagemaker:InvokeEndpointAsync
                  - rds:CreateDBSnapshot
                  - rds:CreateDBClusterSnapshot
                  - ec2:CreateSnapshot
                  - lambda:PutProvisionedConcurrencyConfig
                  - bedrock:OptimizePrompt
                  - bedrock:CreateEvaluationJob
                  - bedrock:StopEvaluationJob
                  - bedrock:CreateAdvancedPromptOptimizationJob
                  - bedrock:StopAdvancedPromptOptimizationJob
                  - bedrock:CreateModelInvocationJob
                  - bedrock:StopModelInvocationJob
                  - transcribe:StartTranscriptionJob
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:CalledViaAWSMCP": aws-mcp.amazonaws.com
              # Execution: remote-execution equivalent (see the warning at the top). ssm:SendCommand / StartSession and
              # ecs:ExecuteCommand are remote shells; lambda:InvokeFunction, states:StartExecution, sqs:SendMessage,
              # sns:Publish and rds-db:connect run business logic or write data.
              - Sid: Execution
                Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:StartSession
                  - ssm:ResumeSession
                  - ssm:TerminateSession
                  - ec2-instance-connect:SendSSHPublicKey
                  - ecs:ExecuteCommand
                  - ecs:RunTask
                  - lambda:InvokeFunction
                  - states:StartExecution
                  - sqs:SendMessage
                  - sns:Publish
                  - rds-db:connect
                  # Business logic and deployments. ssm:StartAutomationExecution runs with the caller's permissions
                  # only (no iam:PassRole for AutomationAssumeRole). RetryStageExecution can re-run deploy stages.
                  # codepipeline:StartPipelineExecution is intentionally NOT granted: sourceRevisions / variables can
                  # swap the source and inject values (like codebuild:StartBuild). glue:StartJobRun and
                  # batch:SubmitJob are NOT granted either: argument / command overrides can run arbitrary code
                  # with the job's role.
                  - states:RedriveExecution
                  - states:StartSyncExecution
                  - bedrock:InvokeAgent
                  - lambda:InvokeFunctionUrl
                  - glue:StartCrawler
                  - glue:StartWorkflowRun
                  - ssm:StartAutomationExecution
                  - events:StartReplay
                  - events:PutEvents
                  - codepipeline:RetryStageExecution
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:CalledViaAWSMCP": aws-mcp.amazonaws.com
              # PassRoleForEcsRunTask: lets ecs:RunTask pass the listed roles, only to ECS tasks.
              # Omitted entirely unless DebugPassableEcsTaskRoleArns is given (iam:PassRole on "*" is a
              # privilege escalation path: a task can run with any role in the account).
              - Fn::If:
                  - HasDebugPassableEcsTaskRoles
                  - Sid: PassRoleForEcsRunTask
                    Effect: Allow
                    Action:
                      - iam:PassRole
                    Resource:
                      Ref: DebugPassableEcsTaskRoleArns
                    Condition:
                      StringEquals:
                        "aws:CalledViaAWSMCP": aws-mcp.amazonaws.com
                        "iam:PassedToService": ecs-tasks.amazonaws.com
                  - Ref: AWS::NoValue
              # PassRoleForBedrockJobs: lets bedrock:CreateEvaluationJob / CreateModelInvocationJob pass the listed roles, only to Bedrock.
              # Omitted entirely unless DebugPassableBedrockServiceRoleArns is given. What can be passed =
              # the listed roles x the Create operations allowed in CostIncurring, decided by the role's effective
              # permissions (including DebugAdditionalPolicyArns and any Bedrock operation added later).
              # The jobs run with the passed role's permissions, and the debug role's Deny on secret reads is not
              # inherited. List only dedicated, least-privilege roles (limit input / output prefixes, models, KMS);
              # never an existing broad role. Trust policy: aws:SourceAccount and, where supported, aws:SourceArn
              # (confirm the key exists for the job type). SourceAccount only counters the confused deputy.
              - Fn::If:
                  - HasDebugPassableBedrockServiceRoles
                  - Sid: PassRoleForBedrockJobs
                    Effect: Allow
                    Action:
                      - iam:PassRole
                    Resource:
                      Ref: DebugPassableBedrockServiceRoleArns
                    Condition:
                      StringEquals:
                        "aws:CalledViaAWSMCP": aws-mcp.amazonaws.com
                        "iam:PassedToService": bedrock.amazonaws.com
                  - Ref: AWS::NoValue
      Tags:
        - Key: project
          Value: awsbridge

Outputs:
  ReadOnlyRoleArn:
    Description: ARN of the read-only role assumed with the Worker-issued JWT.
    Value:
      Fn::GetAtt: [ReadOnlyRole, Arn]
  DebugRoleArn:
    Description: ARN of the debug role assumed with the Worker-issued JWT.
    Value:
      Fn::GetAtt: [DebugRole, Arn]
  OidcProviderArn:
    Description: ARN of the IAM OIDC provider.
    Value:
      Ref: OidcProvider
