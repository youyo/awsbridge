AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  awsbridge - IAM OIDC provider (issuer = awsbridge Worker) and a role that
  the Worker-issued JWT can assume with sts:AssumeRoleWithWebIdentity.

Parameters:
  IssuerHost:
    Type: String
    Description: Worker host name without scheme or trailing slash (e.g. awsbridge.example.workers.dev).
    AllowedPattern: "^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$"
    ConstraintDescription: Host name only. Do not include https:// or a trailing slash.
  Audience:
    Type: String
    Default: awsbridge
    Description: Audience (aud) of the Worker-issued JWT. Also used as the OIDC client ID.
    AllowedPattern: "^[A-Za-z0-9._:-]+$"
  AllowedSubjects:
    Type: CommaDelimitedList
    Description: >-
      Users (JWT sub = email) allowed to assume the role, comma separated.
      Wildcards allowed in the local part only (e.g. user@example.com,*@example.org).
    AllowedPattern: '^[A-Za-z0-9._%+*?-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'
    ConstraintDescription: Each entry must look like user@example.com or *@example.com. A bare * or a wildcard in the domain is not allowed.
  RoleName:
    Type: String
    Default: awsbridge
    Description: Name of the IAM role.
    AllowedPattern: '^[\w+=,.@-]{1,64}$'
    ConstraintDescription: 1-64 characters of alphanumerics and _+=,.@-
  ManagedPolicyArns:
    Type: CommaDelimitedList
    Default: ""
    Description: Managed policy ARNs to attach to the role, comma separated. Empty means none.
  MaxSessionDuration:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
    Description: Maximum session duration of the role in seconds.

Conditions:
  HasManagedPolicies:
    Fn::Not:
      - Fn::Equals:
          - Fn::Join: ["", { Ref: ManagedPolicyArns }]
          - ""

Resources:
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url:
        Fn::Sub: "https://${IssuerHost}"
      ClientIdList:
        - Ref: Audience
      Tags:
        - Key: project
          Value: awsbridge

  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: RoleName
      MaxSessionDuration:
        Ref: MaxSessionDuration
      ManagedPolicyArns:
        Fn::If:
          - HasManagedPolicies
          - Ref: ManagedPolicyArns
          - Ref: AWS::NoValue
      # The condition keys contain the issuer host, and CloudFormation cannot use
      # intrinsic functions in mapping keys, so the policy is built as a JSON string.
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |-
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": { "Federated": "${OidcProvider}" },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": { "${IssuerHost}:aud": "${Audience}" },
                    "StringLike": { "${IssuerHost}:sub": ["${SubjectList}"] }
                  }
                }
              ]
            }
          - SubjectList:
              Fn::Join:
                - '","'
                - Ref: AllowedSubjects
      Tags:
        - Key: project
          Value: awsbridge

Outputs:
  RoleArn:
    Description: ARN of the role assumed with the Worker-issued JWT.
    Value:
      Fn::GetAtt: [Role, Arn]
  OidcProviderArn:
    Description: ARN of the IAM OIDC provider.
    Value:
      Ref: OidcProvider
