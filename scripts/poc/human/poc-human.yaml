AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  awsbridge PoC (human AWS sign-in) - IAM OIDC provider for the PoC issuer Worker
  (awsbridge-human-poc) and roles that a locally signed JWT can assume with
  sts:AssumeRoleWithWebIdentity (HumanRole for sign-in, TaggedRole and NoTagRole for
  session tags, SourceIdentity and emergency stop). Separate from the MCP stack
  (infra/aws/awsbridge.yaml): different issuer, signing key, audience and roles. Delete it after the PoC.

# What the PoC checks (see scripts/poc/human/README.md):
#   PoC-A  Temporary credentials from AssumeRoleWithWebIdentity -> federation endpoint
#          (getSigninToken -> login) -> console sign-in URL, with and without SessionDuration.
#   PoC-B  From that console session, `aws login` (AWS CLI 2.32+) obtains CLI credentials.
#          This needs signin:AuthorizeOAuth2Access and signin:CreateOAuth2Token, granted by the
#          AWS managed policy SignInLocalDevelopmentAccess
#          (https://docs.aws.amazon.com/aws-managed-policy/latest/reference/SignInLocalDevelopmentAccess.html).
#
#   P2     Session tags in the JWT (https://aws.amazon.com/tags) gate the trust policy with
#          aws:RequestTag, and aws:PrincipalTag changes permissions after assumption (TaggedRole).
#          A role without sts:TagSession rejects tagged tokens (NoTagRole).
#   P3     SourceIdentity (https://aws.amazon.com/source_identity) is required by the trust policy
#          (TaggedRole) and recorded in CloudTrail.
#   P4     Emergency stop: revoke sessions (inline policy AWSRevokeOlderSessions added out of band by
#          scripts/poc/human/revoke.ts) and OIDC provider deletion.
#
# Conditions before stage 1a (ADR-003):
#   (1)    LocalOnlyRole: `aws login` limited to the same device. Instead of SignInLocalDevelopmentAccess
#          (oauth2/public-client/*), an inline policy allows the two actions only on
#          arn:aws:signin:<region>:<account>:oauth2/public-client/localhost, so `aws login --remote`
#          (oauth2/public-client/remote) should be denied
#          (https://docs.aws.amazon.com/service-authorization/latest/reference/list_signin.html).
#   (4)    Out-of-band inline policies (AWSRevokeOlderSessions, AwsbridgeDenySourceIdentity added by
#          revoke.ts) survive a stack update (UpdateMarker changes TaggedRole's own inline policy), and
#          a Deny on aws:SourceIdentity stops one user only (SecondSubject adds a second user to TaggedRole).
#   (1')   Rewritten (1): ViewerRole is shaped like the console Viewer and allows `aws login` on both
#          oauth2/public-client/localhost and oauth2/public-client/remote. Checks that both work, what the
#          --remote consent page shows, whether CloudTrail tells them apart, and that Revoke Sessions and the
#          aws:SourceIdentity Deny stop a --remote session including its refresh.
#
# Every trust policy allows exactly one user (sub) with the PoC audience (aud).
# HumanRole allows sts:SetSourceIdentity and sts:TagSession without conditions (used for the tag size limits).

Parameters:
  IssuerHost:
    Type: String
    Description: PoC issuer Worker host name without scheme or trailing slash (e.g. awsbridge-human-poc.example.workers.dev).
    AllowedPattern: "^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$"
    ConstraintDescription: Host name only. Do not include https:// or a trailing slash.
  Audience:
    Type: String
    Default: awsbridge-human-poc
    Description: Audience (aud) of the PoC JWT. Also used as the OIDC client ID. Keep it different from the MCP audience.
    AllowedPattern: "^[A-Za-z0-9._:-]+$"
  Subject:
    Type: String
    Description: The one PoC user (JWT sub = lower-case email, e.g. user@example.com). Wildcards are not allowed.
    AllowedPattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'
    ConstraintDescription: Must be a single email address such as user@example.com (no wildcards, no lists).
  RoleName:
    Type: String
    Default: AwsbridgeHumanPoc
    Description: >-
      Name of the PoC IAM role. The other roles are named <RoleName>Tagged, <RoleName>NoTag,
      <RoleName>LocalOnly and <RoleName>Viewer.
    AllowedPattern: '^[\w+=,.@-]{1,55}$'
    ConstraintDescription: 1-55 characters of alphanumerics and _+=,.@- (a suffix of up to 9 characters is added for the other roles)
  SecondSubject:
    Type: String
    Default: none
    Description: >-
      (4-b) A second PoC user (lower-case email) that may also assume TaggedRole, with its own
      SourceIdentity. "none" means no second user.
    AllowedPattern: '^(none|[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+)$'
    ConstraintDescription: none, or a single email address such as second@example.com (no wildcards, no lists).
  UpdateMarker:
    Type: String
    Default: "0"
    Description: >-
      (4-a) Change this value to force an update of TaggedRole's own inline policy (its Sid), and check
      whether inline policies added outside CloudFormation survive the update.
    AllowedPattern: "^[A-Za-z0-9]{1,16}$"
    ConstraintDescription: 1-16 alphanumerics (it becomes part of an IAM Sid).

Conditions:
  HasSecondSubject:
    Fn::Not:
      - Fn::Equals:
          - Ref: SecondSubject
          - none

Resources:
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url:
        Fn::Sub: "https://${IssuerHost}"
      ClientIdList:
        - Ref: Audience
      Tags:
        - Key: project
          Value: awsbridge-human-poc

  HumanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: RoleName
      # 12 hours: the longest console / CLI session the PoC tries.
      MaxSessionDuration: 43200
      ManagedPolicyArns:
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
        # signin:AuthorizeOAuth2Access / signin:CreateOAuth2Token for `aws login` (PoC-B)
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/SignInLocalDevelopmentAccess"
      # The condition keys contain the issuer host, so the document is built as a JSON string.
      AssumeRolePolicyDocument:
        Fn::Sub: |-
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "${OidcProvider}" },
                "Action": [
                  "sts:AssumeRoleWithWebIdentity",
                  "sts:SetSourceIdentity",
                  "sts:TagSession"
                ],
                "Condition": {
                  "StringEquals": {
                    "${IssuerHost}:aud": "${Audience}",
                    "${IssuerHost}:sub": "${Subject}"
                  }
                }
              }
            ]
          }
      Tags:
        - Key: project
          Value: awsbridge-human-poc

  # P2/P3/P4: the trust policy requires access_profile (poc-admin or poc-viewer) as the only session tag
  # and a SourceIdentity. All conditions sit in the one Allow statement, so no other statement can bypass them.
  TaggedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "${RoleName}Tagged"
      MaxSessionDuration: 43200
      ManagedPolicyArns:
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
        # Console and `aws login` are used for P3/P4 with this role as well
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/SignInLocalDevelopmentAccess"
      Policies:
        - PolicyName: PrincipalTagPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # P2: the same role grants different permissions depending on the session tag.
              # (4-a) the Sid ends with UpdateMarker, so changing it updates this CloudFormation-managed policy.
              - Sid:
                  Fn::Sub: "DenyListRolesUnlessPocAdmin${UpdateMarker}"
                Effect: Deny
                Action: iam:ListRoles
                Resource: "*"
                Condition:
                  StringNotEquals:
                    aws:PrincipalTag/access_profile: poc-admin
      # (4-b) with SecondSubject, sub may be either user (each with its own SourceIdentity).
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |-
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": { "Federated": "${OidcProvider}" },
                  "Action": [
                    "sts:AssumeRoleWithWebIdentity",
                    "sts:TagSession",
                    "sts:SetSourceIdentity"
                  ],
                  "Condition": {
                    "StringEquals": {
                      "${IssuerHost}:aud": "${Audience}",
                      "${IssuerHost}:sub": ${SubjectList},
                      "aws:RequestTag/access_profile": ["poc-admin", "poc-viewer"]
                    },
                    "ForAllValues:StringEquals": {
                      "aws:TagKeys": ["access_profile"]
                    },
                    "Null": {
                      "sts:SourceIdentity": "false"
                    }
                  }
                }
              ]
            }
          - SubjectList:
              Fn::If:
                - HasSecondSubject
                - Fn::Sub: '["${Subject}", "${SecondSubject}"]'
                - Fn::Sub: '"${Subject}"'
      Tags:
        - Key: project
          Value: awsbridge-human-poc

  # P2: without sts:TagSession (and sts:SetSourceIdentity) a tagged token should be rejected.
  NoTagRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "${RoleName}NoTag"
      ManagedPolicyArns:
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
      AssumeRolePolicyDocument:
        Fn::Sub: |-
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "${OidcProvider}" },
                "Action": ["sts:AssumeRoleWithWebIdentity"],
                "Condition": {
                  "StringEquals": {
                    "${IssuerHost}:aud": "${Audience}",
                    "${IssuerHost}:sub": "${Subject}"
                  }
                }
              }
            ]
          }
      Tags:
        - Key: project
          Value: awsbridge-human-poc

  # (1) `aws login` only on the same device: no SignInLocalDevelopmentAccess (which allows
  # oauth2/public-client/*), only the localhost client. `aws login --remote` uses
  # oauth2/public-client/remote and should be denied. Same trust policy as HumanRole.
  LocalOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "${RoleName}LocalOnly"
      MaxSessionDuration: 43200
      ManagedPolicyArns:
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
      Policies:
        - PolicyName: AwsLoginLocalhostOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AwsLoginSameDeviceOnly
                Effect: Allow
                Action:
                  - signin:AuthorizeOAuth2Access
                  - signin:CreateOAuth2Token
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:signin:*:${AWS::AccountId}:oauth2/public-client/localhost"
      AssumeRolePolicyDocument:
        Fn::Sub: |-
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "${OidcProvider}" },
                "Action": [
                  "sts:AssumeRoleWithWebIdentity",
                  "sts:SetSourceIdentity",
                  "sts:TagSession"
                ],
                "Condition": {
                  "StringEquals": {
                    "${IssuerHost}:aud": "${Audience}",
                    "${IssuerHost}:sub": "${Subject}"
                  }
                }
              }
            ]
          }
      Tags:
        - Key: project
          Value: awsbridge-human-poc

  # Condition (1) rewritten (cto decision 2026-11-12): the console Viewer may use `aws login --remote`.
  # Same shape as the Viewer: ReadOnlyAccess, the same Deny on secret values as infra/aws/awsbridge.yaml
  # (DenySecretValueRead), and `aws login` allowed only on the localhost and remote public clients
  # (no SignInLocalDevelopmentAccess, no oauth2/public-client/*). The trust policy requires a SourceIdentity
  # (for the one-user Deny on aws:SourceIdentity); session tags are allowed but not required.
  ViewerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "${RoleName}Viewer"
      MaxSessionDuration: 43200
      ManagedPolicyArns:
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
      Policies:
        - PolicyName: DenySecretValueRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenySsmParameterRead
                Effect: Deny
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:GetParameterHistory
                Resource: "*"
              - Sid: DenySecretsManagerRead
                Effect: Deny
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:BatchGetSecretValue
                Resource: "*"
        - PolicyName: AwsLoginLocalAndRemote
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AwsLoginSameAndCrossDevice
                Effect: Allow
                Action:
                  - signin:AuthorizeOAuth2Access
                  - signin:CreateOAuth2Token
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:signin:*:${AWS::AccountId}:oauth2/public-client/localhost"
                  - Fn::Sub: "arn:${AWS::Partition}:signin:*:${AWS::AccountId}:oauth2/public-client/remote"
      AssumeRolePolicyDocument:
        Fn::Sub: |-
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "${OidcProvider}" },
                "Action": [
                  "sts:AssumeRoleWithWebIdentity",
                  "sts:SetSourceIdentity",
                  "sts:TagSession"
                ],
                "Condition": {
                  "StringEquals": {
                    "${IssuerHost}:aud": "${Audience}",
                    "${IssuerHost}:sub": "${Subject}"
                  },
                  "Null": {
                    "sts:SourceIdentity": "false"
                  }
                }
              }
            ]
          }
      Tags:
        - Key: project
          Value: awsbridge-human-poc

Outputs:
  RoleArn:
    Description: ARN of the PoC role (assumed with the locally signed JWT).
    Value:
      Fn::GetAtt: [HumanRole, Arn]
  OidcProviderArn:
    Description: ARN of the PoC IAM OIDC provider.
    Value:
      Ref: OidcProvider
  TaggedRoleArn:
    Description: ARN of the P2-P4 role (session tag access_profile and SourceIdentity are required).
    Value:
      Fn::GetAtt: [TaggedRole, Arn]
  NoTagRoleArn:
    Description: ARN of the P2 role without sts:TagSession.
    Value:
      Fn::GetAtt: [NoTagRole, Arn]
  LocalOnlyRoleArn:
    Description: ARN of the (1) role whose `aws login` is limited to the localhost client (no --remote).
    Value:
      Fn::GetAtt: [LocalOnlyRole, Arn]
  ViewerRoleArn:
    Description: ARN of the role shaped like the console Viewer (aws login on localhost and remote, SourceIdentity required).
    Value:
      Fn::GetAtt: [ViewerRole, Arn]
