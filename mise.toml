[tools]
node = "24"
"pipx:cfn-lint" = "1.59.0"
pnpm = "11.28.5"

[env]
# 呼び出し側の環境変数を優先し、未設定のときだけ既定値を使う（別アカウントへは AWS_PROFILE=<対象> mise run deploy:aws）
AWS_PROFILE = '{{ get_env(name="AWS_PROFILE", default="awsbridge") }}'
AWSBRIDGE_AUDIENCE = '{{ get_env(name="AWSBRIDGE_AUDIENCE", default="awsbridge") }}'
AWSBRIDGE_ROLE_NAME = '{{ get_env(name="AWSBRIDGE_ROLE_NAME", default="awsbridge") }}'
AWSBRIDGE_STACK_NAME = '{{ get_env(name="AWSBRIDGE_STACK_NAME", default="awsbridge") }}'
# wrangler の環境名（wrangler.jsonc の env.<名前>）。上流の開発用は dev。下流リポジトリは prod などを追加して切り替える
AWSBRIDGE_WRANGLER_ENV = '{{ get_env(name="AWSBRIDGE_WRANGLER_ENV", default="dev") }}'
# 個人情報・アカウント固有値は mise.local.toml（gitignore）に置く:
#   AWSBRIDGE_ISSUER           = "https://<worker>.<subdomain>.workers.dev"（Worker の URL = OIDC issuer）
#   AWSBRIDGE_ALLOWED_SUBJECTS = "user@example.com,*@example.org"（ロールを引き受けられる利用者。カンマ区切り）
#   AWSBRIDGE_MANAGED_POLICY_ARNS = "arn:aws:iam::aws:policy/ReadOnlyAccess"（任意。ロールに付ける管理ポリシー。カンマ区切り）
#   AWSBRIDGE_POC_SUBJECT      = "user@example.com"（poc:sts の正常ケースで使う利用者）
#   AWSBRIDGE_ACCESS_TEAM_DOMAIN = "https://team.example.cloudflareaccess.com"（Access のチームドメイン。secrets タスクが Worker secret ACCESS_TEAM_DOMAIN に登録）
#   AWSBRIDGE_PROFILES         = '{"default":"dev","profiles":{"dev":{"roleArn":"arn:aws:iam::<アカウントID>:role/awsbridge"}}}'（JSON 文字列。各アカウントの deploy:aws 出力 RoleArn を並べる。secrets タスクが Worker secret AWS_PROFILES に登録）
#   AWSBRIDGE_ACCESS_AUD       = "<Access アプリケーションの AUD タグ>"（secrets タスクが Worker secret ACCESS_AUD に登録）
# 開発用署名鍵（秘密鍵 JWK）の置き場所。.secrets/ は gitignore
AWSBRIDGE_KEY_FILE = "{{config_root}}/.secrets/dev-signing-key.json"

[tasks.install]
description = "依存パッケージのインストール"
run = "pnpm install"

[tasks.typecheck]
description = "型チェック"
run = "pnpm tsc --noEmit"

[tasks."test:unit"]
description = "Unit テスト"
run = "pnpm vitest run --config vitest.config.ts"

[tasks."test:e2e"]
description = "E2E テスト（wrangler dev を起動して検証）"
run = "pnpm vitest run --config vitest.e2e.config.ts"

[tasks.test]
description = "Unit + E2E"
depends = ["test:unit", "test:e2e"]

[tasks.lint]
description = "lint・フォーマット検査・型チェック・CloudFormation テンプレート検査（cfn-lint）"
depends = ["typecheck"]
run = ["pnpm biome check .", "cfn-lint infra/aws/awsbridge.yaml"]

[tasks.fmt]
description = "フォーマット"
run = "pnpm biome check --write ."

[tasks.build]
description = "ビルド確認（デプロイせずにバンドル）"
run = "pnpm wrangler deploy --dry-run --outdir dist --env ${AWSBRIDGE_WRANGLER_ENV}"

[tasks.dev]
description = "ローカル起動"
run = "pnpm wrangler dev --env ${AWSBRIDGE_WRANGLER_ENV}"

[tasks.keygen]
description = "署名鍵（RSA、秘密鍵 JWK）を生成し .secrets/ に保存（既存なら上書きしない）"
run = "pnpm tsx scripts/poc/keygen.ts"

[tasks.secrets]
description = "Worker secret（SIGNING_JWK / ACCESS_TEAM_DOMAIN / ACCESS_AUD / AWS_PROFILES）を一括登録。AWS_PROFILES は AWSBRIDGE_PROFILES（JSON 文字列）から読む（AWS は呼ばない）"
run = "bash scripts/put-secrets.sh"

[tasks."deploy:worker"]
description = "Cloudflare 側のデプロイ: Worker を workers.dev へデプロイ（ISSUER = AWSBRIDGE_ISSUER）→ secret 登録。AWS は呼ばない"
run = [
  "pnpm wrangler deploy --env ${AWSBRIDGE_WRANGLER_ENV} --var \"ISSUER:${AWSBRIDGE_ISSUER:?mise.local.toml に AWSBRIDGE_ISSUER を設定してください}\"",
  "mise run secrets",
]

[tasks."deploy:aws"]
description = "CloudFormation で IAM OIDC プロバイダーとロールをデプロイ"
run = "bash scripts/deploy-aws.sh"

[tasks."destroy:aws"]
description = "CloudFormation スタックを削除"
run = "bash scripts/destroy-aws.sh"

# ---- 検証用（PoC 由来）。実 AWS を呼ぶので明示的に実行したときだけ使う ----

[tasks."poc:mint"]
description = "署名鍵で STS 向け JWT を発行して標準出力に出す"
run = "pnpm tsx scripts/poc/mint.ts"

[tasks."poc:sts"]
description = "Worker 発行 JWT で AssumeRoleWithWebIdentity を実行し、否定ケースも確認（--role-arn 省略時はスタックの Output RoleArn）"
run = "pnpm tsx scripts/poc/sts.ts"
