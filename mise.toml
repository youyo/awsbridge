[tools]
gitleaks = "8.30.1"
node = "24"
"pipx:cfn-lint" = "1.59.0"
pnpm = "11.28.5"
terraform = "1.15.8"
tflint = "0.64.0"

[env]
# 上書きされうる既定値（AWS_PROFILE / AWSBRIDGE_AUDIENCE / AWSBRIDGE_STACK_NAME / AWSBRIDGE_KEY_FILE /
# AWSBRIDGE_WRANGLER_ENV / AWSBRIDGE_WRANGLER_CONFIG）はここに置かず、scripts/*.sh と scripts/poc/ 側の既定値で補う。
# ここに置くと、下流の mise 設定ファイル（mise.<name>.toml）や環境変数で上書きしにくくなるため。
# 下流の使い方は README_ja.md「下流リポジトリでの運用」を参照。
# プロファイル一覧（aws_profile で選べるアカウント）は環境変数ではなく、wrangler の alias でバンドルする JSON（config/profiles.json。gitignore）に置く。README_ja.md「マルチアカウント」参照。
# 個人情報・アカウント固有値は mise.local.toml（gitignore）に置く:
#   AWSBRIDGE_ISSUER           = "https://awsbridge-oidc-mcp.example.com"（OIDC issuer = IAM の OIDC プロバイダーの URL。基本は独自ドメインの専用ホスト。パスなし。MCP の接続先 awsbridge-mcp.example.com とは別のホスト）
#                                試用だけなら "https://<worker>.<subdomain>.workers.dev"（AWSBRIDGE_WRANGLER_ENV=dev。既定）。独自ドメインは AWSBRIDGE_WRANGLER_ENV=prod（wrangler.jsonc の env.prod）
#   AWSBRIDGE_ALLOWED_SUBJECTS = "user@example.com,*@example.org"（読み取り専用ロールを引き受けられる利用者。カンマ区切り）
#   AWSBRIDGE_DEBUG_ALLOWED_SUBJECTS = "admin@example.com"（デバッグロールを引き受けられる利用者。カンマ区切り。読み取り専用より絞る）
#   AWSBRIDGE_READONLY_ROLE_NAME / AWSBRIDGE_DEBUG_ROLE_NAME（任意。ロール名。新規スタックの既定は FederatedAwsBridgeMcpViewer / FederatedAwsBridgeMcpDebugger。既存スタックの更新で未設定なら既存の値のまま）
#   AWSBRIDGE_DEBUG_ADDITIONAL_POLICY_ARNS = "arn:aws:iam::<アカウントID>:policy/<名前>"（任意。デバッグロールに追加する管理ポリシー。カンマ区切り）
#   AWSBRIDGE_POC_SUBJECT      = "user@example.com"（poc:sts の正常ケースで使う利用者）
#   AWSBRIDGE_ACCESS_TEAM_DOMAIN = "https://team.example.cloudflareaccess.com"（Access のチームドメイン。secrets タスクが Worker secret ACCESS_TEAM_DOMAIN に登録）
#   AWSBRIDGE_ACCESS_AUD       = "<Access アプリケーションの AUD タグ>"（secrets タスクが Worker secret ACCESS_AUD に登録）
#   AWSBRIDGE_KEY_FILE         = ".secrets/dev-signing-key.json"（任意。署名鍵 JWK の置き場所。既定はリポジトリルートのこのパス。.secrets/ は gitignore）
#   AWSBRIDGE_NEXT_KEY_FILE / AWSBRIDGE_PREVIOUS_KEY_FILE（任意。鍵ローテーション用の次の鍵・前の鍵。既定は KEY_FILE の拡張子の前に .next / .previous を付けたもの。key:* タスクが作る）

[tasks.install]
description = "依存パッケージのインストール"
run = "pnpm install"

[tasks.typecheck]
description = "型チェック"
run = "pnpm tsc --noEmit"

[tasks."test:unit"]
description = "Unit テスト"
run = "pnpm vitest run --config vitest.config.ts"

[tasks."test:e2e"]
description = "E2E テスト（wrangler dev を起動して検証）"
run = "pnpm vitest run --config vitest.e2e.config.ts"

[tasks.test]
description = "Unit + E2E"
depends = ["test:unit", "test:e2e"]

[tasks."lint:terraform"]
description = "Cloudflare Access/Portal の Terraform サンプル（infra/cloudflare）の fmt・validate・tflint"
run = "bash infra/cloudflare/check.sh"

[tasks.lint]
description = "lint・フォーマット検査・型チェック・CloudFormation テンプレート検査（cfn-lint）・Terraform サンプル検査"
depends = ["typecheck", "lint:terraform"]
run = [
  "pnpm biome check .",
  "cfn-lint infra/aws/awsbridge.yaml",
  "cfn-lint infra/aws/console/base.yaml",
  "cfn-lint infra/aws/console/kind.example.yaml",
  "cfn-lint scripts/poc/human/poc-human.yaml",
  "cfn-lint scripts/poc/admin-kms/poc-admin-kms.yaml",
]

[tasks.fmt]
description = "フォーマット"
run = "pnpm biome check --write ."

[tasks.build]
description = "ビルド確認（デプロイせずにバンドル）"
run = "bash scripts/wrangler.sh deploy --dry-run --outdir dist"

[tasks.dev]
description = "ローカル起動"
run = "bash scripts/wrangler.sh dev"

[tasks.keygen]
description = "署名鍵（RSA、秘密鍵 JWK）を生成し .secrets/ に保存（既存なら上書きしない）"
run = "pnpm tsx scripts/poc/keygen.ts"

[tasks."key:prepare"]
description = "署名鍵のローテーション 1/3: 次の鍵を生成して AWSBRIDGE_NEXT_KEY_FILE に保存（あれば中止）。そのあと mise run secrets で公開鍵を載せる"
run = "pnpm tsx scripts/key-rotate.ts prepare"

[tasks."key:activate"]
description = "署名鍵のローテーション 2/3: 現行 → PREVIOUS、NEXT → 現行（NEXT が無い・PREVIOUS があれば中止）。そのあと mise run secrets で署名を切り替える"
run = "pnpm tsx scripts/key-rotate.ts activate"

[tasks."key:retire"]
description = "署名鍵のローテーション 3/3: 前の鍵（PREVIOUS）を削除（無ければ何もしない）。そのあと mise run secrets で古い公開鍵を外す"
run = "pnpm tsx scripts/key-rotate.ts retire"

[tasks.secrets]
description = "Worker secret（SIGNING_JWK / ADDITIONAL_PUBLIC_JWKS / ACCESS_TEAM_DOMAIN / ACCESS_AUD）を一括登録（AWS は呼ばない）。プロファイル一覧は secret にせず config/profiles.json でバンドルする"
run = "bash scripts/put-secrets.sh"

[tasks."deploy:worker"]
description = "Cloudflare 側のデプロイ: Worker をデプロイ（ISSUER = AWSBRIDGE_ISSUER。既定の env=dev は workers.dev、独自ドメインは AWSBRIDGE_WRANGLER_ENV=prod）→ secret 登録。AWS は呼ばない"
run = [
  "bash scripts/wrangler.sh deploy --var \"ISSUER:${AWSBRIDGE_ISSUER:?mise.local.toml に AWSBRIDGE_ISSUER を設定してください}\"",
  "mise run secrets",
]

[tasks."deploy:aws"]
description = "CloudFormation で IAM OIDC プロバイダーとロールをデプロイ"
run = "bash scripts/deploy-aws.sh"

[tasks."destroy:aws"]
description = "CloudFormation スタックを削除"
run = "bash scripts/destroy-aws.sh"

# ---- コンソールログイン: チーム・ロール・種類の設定ファイル（docs/specs/console-login-portal.md §11）----
# 入力と出力の場所は環境変数で変える（既定値は [env] に置かず scripts/console/config.ts 側で補う。下流は mise.<name>.toml で与える）:
#   AWSBRIDGE_CONSOLE_CONFIG          設定ファイル（既定 config/console.json。config/console.example.json か config/console.company.example.json をコピーして作る。gitignore）
#   AWSBRIDGE_CONSOLE_AUD_FILE        Terraform の出力（{ "teams": { <チーム>: <AUD> }, "entry": { "standard": <AUD>, "admin": <AUD> } }。任意）
#   AWSBRIDGE_CONSOLE_INVENTORY_FILE  placement: ou の Organization のアカウント（ListAccounts の結果を整えたもの。任意。email を含むのでコミットしない）
#   AWSBRIDGE_CONSOLE_OUT_DIR         生成物の置き場所（既定 .generated/console。gitignore）
#   AWSBRIDGE_CONSOLE_SOURCE_REVISION 生成物に記録する設定のコミット（任意）
# どちらも AWS・Cloudflare・Terraform を呼ばない。

[tasks."console:config:check"]
description = "コンソールログインの設定ファイルを検査する（スキーマ・参照・重複・階層。AUD のファイルを渡せば AUD の対応も）。生成物は書かない"
run = "pnpm tsx scripts/console/config.ts check"

[tasks."console:config:generate"]
description = "コンソールログインの設定ファイルから、Worker 用（階層ごと）・表示用（Standard の display.standard.json）・StackSets 用・Access の検査用の生成物と、種類ごとのロールのテンプレート（kind.<kind>.yaml。参考の形）を書く（Standard の入口とチームの AUD が要る。Admin の入口の AUD は要らない）"
run = "pnpm tsx scripts/console/config.ts generate"

[tasks."console:template:example"]
description = "参考のロールのテンプレート infra/aws/console/kind.example.yaml を、会社用の設定の例（config/console.company.example.json）の種類 C から書き直す（生成器を変えたら回す）"
run = "pnpm tsx scripts/console/kind-example.ts"

[tasks."console:inspect"]
description = "コンソールログインの検査の道具: プロファイルのアカウントの IAM を読み（書き込まない）、信頼ポリシー（許可リスト方式）・パス・守りの部品の今の版・予約名の衝突・棚卸し・署名アカウントを確かめる（--profile <名前> が要る。--stops <file> で停止中の確認。出力は伏せ字）"
run = "pnpm tsx scripts/console/inspect.ts"

# ---- コンソールログイン: Admin の署名鍵（Workers の secret_key 型。X1 の決裁）。手順は README の「コンソールログインの Admin の署名鍵」----
# 人が手元で実行する（CI から実行しない）。put と retire は -- --yes を付けたときだけ Cloudflare API を書き換える（既定は表示だけ）。
# 変数（[env] に置かず mise.local.toml に置く）: AWSBRIDGE_CONSOLE_ADMIN_CF_ACCOUNT_ID、AWSBRIDGE_CONSOLE_ADMIN_CF_API_TOKEN（任意。無ければ wrangler の OAuth）、
#   AWSBRIDGE_CONSOLE_ADMIN_WRANGLER_CONFIG（既定 wrangler.console-admin.jsonc）、AWSBRIDGE_CONSOLE_ADMIN_ACCESS_TOKEN（check の key-check 用。任意）

[tasks."console:admin-key:put"]
description = "Admin の署名鍵を手元のメモリの中で作り、Cloudflare API で secret_key（ADMIN_KEY_<kid の 16 進>）として入れる。同じ名前があれば止める。-- --yes で実行（既定は表示だけ）"
run = "pnpm tsx scripts/console/admin-key.ts put"

[tasks."console:admin-key:retire"]
description = "旧い Admin の署名鍵のバインディングを消す（今の鍵・vars とデプロイ済みの JWKS に残る鍵は断る。JWKS が取れなければ断る）。-- --binding ADMIN_KEY_… --yes で実行"
run = "pnpm tsx scripts/console/admin-key.ts retire"

[tasks."console:admin-key:check"]
description = "デプロイ後の確認: 今の鍵が secret_key か、Admin の issuer の discovery と JWKS が vars と合うか、key-check（取り出せない・exportKey が失敗する・自己検証）"
run = "pnpm tsx scripts/console/admin-key.ts check"

# ---- コンソールログイン: Standard の署名鍵（境界ごとの Workers の secret_key 型。cto の決裁「Standard も secret_key に揃える」）----
# 手順は README の「コンソールログインの Standard の署名鍵」。人が手元で実行する（CI から実行しない）。
# put・retire・secrets は -- --yes を付けたときだけ Cloudflare API を書き換える（既定は表示だけ）。Admin の道具と別のトークンを使う。
# 変数（[env] に置かず mise.local.toml に置く）: AWSBRIDGE_CONSOLE_STANDARD_CF_ACCOUNT_ID、AWSBRIDGE_CONSOLE_STANDARD_CF_API_TOKEN（任意。無ければ wrangler の OAuth）、
#   AWSBRIDGE_CONSOLE_STANDARD_WRANGLER_CONFIG（既定 wrangler.console-standard.jsonc）、AWSBRIDGE_CONSOLE_STANDARD_ACCESS_TOKEN（check の key-check 用。任意）

[tasks."console:standard-key:put"]
description = "Standard の境界の署名鍵を手元のメモリの中で作り、Cloudflare API で secret_key（STANDARD_KEY_<kid の 16 進>）として入れる。同じ名前があれば止める。-- --boundary <境界> --yes で実行（既定は表示だけ）"
run = "pnpm tsx scripts/console/standard-key.ts put"

[tasks."console:standard-key:retire"]
description = "旧い Standard の署名鍵のバインディングを消す（どれかの境界の今の鍵・vars とデプロイ済みの JWKS に残る鍵・STANDARD_KEY_ 以外の名前は断る）。-- --binding STANDARD_KEY_… --yes で実行"
run = "pnpm tsx scripts/console/standard-key.ts retire"

[tasks."console:standard-key:check"]
description = "デプロイ後の確認: 境界ごとに今の鍵が secret_key か、issuer の discovery と JWKS が vars と合うか、key-check（取り出せない・exportKey が失敗する・自己検証）"
run = "pnpm tsx scripts/console/standard-key.ts check"

[tasks."console:secrets:standard"]
description = "Standard の Worker の CSRF の鍵 CONSOLE_CSRF_KEY（secret_text）を、手元で作った 32 バイトの乱数で Cloudflare API から入れる（ファイルに書かない・表示しない）。署名鍵は入れない。-- --yes で実行"
run = "pnpm tsx scripts/console/secrets.ts"

# ---- コンソールログイン（Standard）: ビルド確認と手元の起動（デプロイは利用者が承認して手で行う）----
# wrangler の設定は AWSBRIDGE_CONSOLE_STANDARD_WRANGLER_CONFIG（既定 wrangler.console-standard.jsonc）。MCP 用の AWSBRIDGE_WRANGLER_CONFIG / AWSBRIDGE_WRANGLER_ENV には左右されない（--env は付けない）。

[tasks."console:build:standard"]
description = "コンソールログイン（Standard）: wrangler deploy --dry-run でバンドルだけ確かめる（デプロイしない。先に console:config:generate が要る。鍵の vars が空でもよい）"
run = 'env AWSBRIDGE_WRANGLER_CONFIG="${AWSBRIDGE_CONSOLE_STANDARD_WRANGLER_CONFIG:-wrangler.console-standard.jsonc}" AWSBRIDGE_WRANGLER_ENV= bash scripts/wrangler.sh deploy --dry-run --outdir dist/console-standard'

[tasks."console:dev"]
description = "コンソールログイン（Standard）: wrangler dev で手元に起動（手元用。先に console:config:generate が要る）"
run = 'env AWSBRIDGE_WRANGLER_CONFIG="${AWSBRIDGE_CONSOLE_STANDARD_WRANGLER_CONFIG:-wrangler.console-standard.jsonc}" AWSBRIDGE_WRANGLER_ENV= bash scripts/wrangler.sh dev'

[tasks."secrets:scan"]
description = "gitleaks で秘密の漏れを検査する（コミットの履歴と、未コミットを含む作業ツリー）"
run = "bash scripts/secrets-scan.sh"

# ---- 検証用（PoC 由来）。実 AWS を呼ぶので明示的に実行したときだけ使う ----

[tasks."poc:mint"]
description = "署名鍵で STS 向け JWT を発行して標準出力に出す"
run = "pnpm tsx scripts/poc/mint.ts"

[tasks."poc:sts"]
description = "Worker 発行 JWT で AssumeRoleWithWebIdentity を実行し、否定ケースも確認（--role-arn 省略時はスタックの Output ReadOnlyRoleArn）"
run = "pnpm tsx scripts/poc/sts.ts"

# ---- PoC X1-(h): secret_key が、別の secret の更新（wrangler secret put・secret bulk など）のあとも残るか。Cloudflare だけを呼ぶ ----
# 設定は AWSBRIDGE_X1H_POC_CF_ACCOUNT_ID（mise.local.toml）だけを読む。トークンは wrangler login の OAuth。明示的に実行したときだけ使う。

[tasks."poc:x1h:run"]
description = "PoC X1-(h): Worker awsbridge-x1h-poc をデプロイして secret_key を入れ、別の secret の更新の経路ごとに鍵が残るかを probe と API で見る"
run = "pnpm tsx scripts/poc/x1h/run.ts"

[tasks."poc:x1h:destroy"]
description = "PoC X1-(h): Worker awsbridge-x1h-poc を消し、手元のデプロイ用の設定を消す"
run = "bash scripts/poc/x1h/destroy.sh"

[tasks."poc:x1h:clean-check"]
description = "PoC X1-(h): Worker awsbridge-x1h-poc が残っていないかを Cloudflare API で確かめる（読み取りだけ）"
run = "pnpm tsx scripts/poc/x1h/clean-check.ts"

# ---- PoC: awsbridge 方式を人間の AWS ログイン（コンソール・aws login）に使えるか。手順は scripts/poc/human/README.md ----
# MCP 経路とは別の issuer（Worker awsbridge-human-poc）・署名鍵・ロール・audience を使う。設定は AWSBRIDGE_HUMAN_POC_* だけを読む。
# 実 AWS / Cloudflare を呼ぶもの（deploy-issuer / deploy-aws / console-url / destroy）は明示的に実行したときだけ使う。

[tasks."poc:human:keygen"]
description = "PoC（人間のログイン）: 専用の署名鍵を .secrets/poc-human/ に生成（既存なら上書きしない）"
run = "pnpm tsx scripts/poc/human/keygen.ts"

[tasks."poc:human:deploy-issuer"]
description = "PoC（人間のログイン）: discovery と JWKS を手元で作り、静的に返す Worker awsbridge-human-poc を workers.dev へデプロイして公開内容を確認（AWS は呼ばない。--dry-run でバンドルだけ）"
run = "pnpm tsx scripts/poc/human/deploy-issuer.ts"

[tasks."poc:human:deploy-aws"]
description = "PoC（人間のログイン）: CloudFormation で PoC 用の OIDC プロバイダーとロール AwsbridgeHumanPoc をデプロイ（Cloudflare は呼ばない）"
run = "bash scripts/poc/human/deploy-aws.sh"

[tasks."poc:human:console-url"]
description = "PoC（人間のログイン）: JWT → AssumeRoleWithWebIdentity → getSigninToken（SessionDuration あり・なし）→ ログイン URL を .secrets/poc-human/ に書く"
run = "pnpm tsx scripts/poc/human/console-url.ts"

[tasks."poc:human:destroy"]
description = "PoC（人間のログイン）: CloudFormation スタックと Worker awsbridge-human-poc を削除し、手元のログイン URL・認証情報を消す"
run = "bash scripts/poc/human/destroy.sh"

# ---- PoC P2〜P4（セッションタグ・SourceIdentity・緊急停止）。手順は scripts/poc/human/README.md ----
# checks / stop-watch / revoke / unrevoke / delete-provider / recreate-provider / trail は実 AWS を呼ぶ。明示的に実行したときだけ使う。

[tasks."poc:human:checks"]
description = "PoC P2/P3: セッションタグ（入れ子・平坦）と SourceIdentity のケース表を流し、期待と実際（成功 / エラーコード）を表で出す（認証情報は出さない）"
run = "pnpm tsx scripts/poc/human/checks.ts"

[tasks."poc:human:stop-watch"]
description = "PoC P4: 認証情報ファイル・AWS プロファイル・新しい引き受けを数秒おきに s3:ListBuckets で見張り、最後の成功と最初の拒否の時刻を出す"
run = "pnpm tsx scripts/poc/human/stop-watch.ts"

[tasks."poc:human:revoke"]
description = "PoC P4 (a): PoC のロール（既定 Tagged）に AWSRevokeOlderSessions 相当のインラインポリシーを付け、完了時刻（UTC）を出す"
run = "pnpm tsx scripts/poc/human/revoke.ts revoke"

[tasks."poc:human:unrevoke"]
description = "PoC P4 (a): revoke で付けたインラインポリシー AWSRevokeOlderSessions を外す"
run = "pnpm tsx scripts/poc/human/revoke.ts unrevoke"

[tasks."poc:human:delete-provider"]
description = "PoC P4 (b): PoC の OIDC プロバイダー（issuer が AWSBRIDGE_HUMAN_POC_ISSUER と一致するものだけ）を消し、完了時刻（UTC）を出す"
run = "pnpm tsx scripts/poc/human/revoke.ts delete-provider"

[tasks."poc:human:recreate-provider"]
description = "PoC P4 (b): 消した OIDC プロバイダーを同じ URL・client ID・タグで作り直す（deploy-aws では作り直されない）"
run = "pnpm tsx scripts/poc/human/revoke.ts recreate-provider"

# ---- 段階 1a の前の条件（ADR-003 相当）: (1) aws login を localhost だけに・(4) CFN の外のポリシーと 1 人だけ止める Deny ----
# 手順は scripts/poc/human/README.md「段階 1a の前の条件」。deny-si / undeny-si は IAM を変える。inline-policies / drift は読み取りとドリフト検出だけ。

[tasks."poc:human:deny-si"]
description = "PoC (4-b): PoC のロール（既定 Tagged）に AwsbridgeDenySourceIdentity（aws:SourceIdentity が 1 人の利用者と一致するセッションの全操作を Deny）を付け、完了時刻（UTC）を出す（--who primary|second）"
run = "pnpm tsx scripts/poc/human/revoke.ts deny-si"

[tasks."poc:human:undeny-si"]
description = "PoC (4-b): deny-si で付けたインラインポリシー AwsbridgeDenySourceIdentity を外し、完了時刻（UTC）を出す"
run = "pnpm tsx scripts/poc/human/revoke.ts undeny-si"

[tasks."poc:human:inline-policies"]
description = "PoC (4-a): スタックの全ロールのインラインポリシー名を出し、Tagged に AWSRevokeOlderSessions・AwsbridgeDenySourceIdentity が残っているかを判定する（読み取りだけ）"
run = "pnpm tsx scripts/poc/human/persist.ts inline"

[tasks."poc:human:drift"]
description = "PoC (4-a): スタックのドリフト検出を実行し、リソースごとの状態と差分の場所・種類（とポリシー名）を出す（値は出さない。IAM は変えない）"
run = "pnpm tsx scripts/poc/human/persist.ts drift"

[tasks."poc:human:trail-signin"]
description = "PoC（Viewer の aws login）: CloudTrail の aws login のイベント（signin.amazonaws.com の AuthorizeOAuth2Access / CreateOAuth2Token）を平らにして出す（トークン・コード・email・アカウント ID は伏せる）"
run = "pnpm tsx scripts/poc/human/trail.ts --signin"

[tasks."poc:human:trail"]
description = "PoC P2/P3: CloudTrail で直近の AssumeRoleWithWebIdentity と、そのセッションの API イベントの SourceIdentity・セッションタグを出す（email は伏せる）"
run = "pnpm tsx scripts/poc/human/trail.ts"

# ---- PoC（人間のログイン）のポータル: N9（パス付き issuer）・N1 の M2（パスごとの Access アプリと AUD）・N10（Access + Worker の通し経路） ----
# 手順は scripts/poc/human/portal/README.md。設定は AWSBRIDGE_HUMAN_POC_PORTAL_* だけを読む（MCP 用・既存の PoC の変数は読まない）。
# 実 AWS / Cloudflare を呼ぶもの（deploy / deploy-aws / access-plan / access-apply / checks / watch / revoke-tokens / destroy）は明示的に実行したときだけ使う。

[tasks."poc:human:portal:keygen"]
description = "PoC ポータル: std と admin の署名鍵を .secrets/poc-human/portal/ に生成（既存なら上書きしない）"
run = "pnpm tsx scripts/poc/human/portal/keygen.ts"

[tasks."poc:human:portal:deploy"]
description = "PoC ポータル: Worker awsbridge-human-poc-portal を自社ドメインの Custom Domain（AWSBRIDGE_HUMAN_POC_PORTAL_HOST。workers.dev・Preview URL は無効）へデプロイし、std / admin の issuer の文書を照合（スタックと Access の出力を読む。--dry-run / --check-only / --poc-token）"
run = "pnpm tsx scripts/poc/human/portal/deploy.ts"

[tasks."poc:human:portal:deploy-aws"]
description = "PoC ポータル: CloudFormation でパス付き issuer の OIDC プロバイダー 2 つとロール AwsbridgeHumanPocPortal* をデプロイ（Cloudflare は呼ばない）"
run = "bash scripts/poc/human/portal/deploy-aws.sh"

[tasks."poc:human:portal:access-plan"]
description = "PoC ポータル: Access アプリ（scripts/poc/human/portal/access、別の state）の terraform plan"
run = 'terraform -chdir=scripts/poc/human/portal/access init -input=false && terraform -chdir=scripts/poc/human/portal/access plan -var "worker_host=${AWSBRIDGE_HUMAN_POC_PORTAL_HOST:?mise.local.toml に AWSBRIDGE_HUMAN_POC_PORTAL_HOST を設定してください}"'

[tasks."poc:human:portal:access-apply"]
description = "PoC ポータル: Access アプリ（scripts/poc/human/portal/access、別の state）の terraform apply（-auto-approve。PoC 用の state だけ）。そのあと poc:human:portal:deploy をやり直す"
run = 'terraform -chdir=scripts/poc/human/portal/access init -input=false && terraform -chdir=scripts/poc/human/portal/access apply -auto-approve -var "worker_host=${AWSBRIDGE_HUMAN_POC_PORTAL_HOST:?mise.local.toml に AWSBRIDGE_HUMAN_POC_PORTAL_HOST を設定してください}"'

[tasks."poc:human:portal:checks"]
description = "PoC ポータル N9: 手元の鍵で署名した JWT で STS をケースごとに呼び、パス付き issuer の可否を表で出す（--only 1,3）"
run = "pnpm tsx scripts/poc/human/portal/checks.ts"

[tasks."poc:human:portal:watch"]
description = "PoC ポータル N10: ブラウザの Access の Cookie で /t/<チーム>/whoami を見張り、拒否とトークンの取り直しの時刻を出す（--team infra）"
run = "pnpm tsx scripts/poc/human/portal/access-watch.ts"

[tasks."poc:human:portal:revoke-tokens"]
description = "PoC ポータル N10: PoC の Access アプリ（--app awsbridge-human-poc-portal-<チーム>）の既存のトークンを失効させ、完了時刻を出す"
run = "pnpm tsx scripts/poc/human/portal/access-revoke.ts"

[tasks."poc:human:portal:tail"]
description = "PoC ポータル: Worker のログ（whoami・login の要約。トークンは出さない）を流す"
run = "env -u CLOUDFLARE_API_TOKEN pnpm exec wrangler tail --config scripts/poc/human/portal/wrangler.jsonc --format pretty"

[tasks."poc:human:portal:destroy"]
description = "PoC ポータル: スタック → Worker → Access アプリ（Terraform）の順に削除し、手元の Worker の secret と Cookie を消す"
run = "bash scripts/poc/human/portal/destroy.sh"

[tasks."poc:human:portal:bypass-check"]
description = "PoC ポータル（cto の条件 (2)）: Access を経由しない入口が閉じているかを確かめる（B1 workers.dev・Version URL / B2 API で入口の一覧 / B3 偽の Cf-Access-Jwt-Assertion / B4 失効済み JWT の持ち込み。--case B4 --revoke で失効させる。--after-destroy は片付けの確認）"
run = "pnpm tsx scripts/poc/human/portal/bypass-check.ts"

[tasks."poc:human:portal:lint"]
description = "PoC ポータル: CloudFormation（cfn-lint）と Access の Terraform（fmt・validate・tflint）の静的検査"
run = [
  "cfn-lint scripts/poc/human/portal/poc-portal.yaml",
  "bash scripts/poc/human/portal/access/check.sh",
]

# ---- PoC N6: Admin の階層の署名鍵を AWS KMS に置く。手順は scripts/poc/admin-kms/README.md ----
# MCP 用・既存の PoC とは別の Worker（awsbridge-admin-kms-poc）・スタック・鍵・audience を使う。設定は AWSBRIDGE_ADMIN_KMS_POC_* だけを読む。
# どれも実 AWS / Cloudflare を呼ぶ（deploy -- --dry-run を除く）。明示的に実行したときだけ使う。

[tasks."poc:admin-kms:deploy-aws"]
description = "PoC N6: CloudFormation で KMS の鍵 3 つ・Worker 用の IAM ユーザー（kms:Sign だけ）・OIDC プロバイダー・ロール AwsbridgeAdminKmsPoc をデプロイ（Cloudflare は呼ばない）"
run = "bash scripts/poc/admin-kms/deploy-aws.sh"

[tasks."poc:admin-kms:deploy"]
description = "PoC N6: KMS の GetPublicKey から JWKS を作り、Worker awsbridge-admin-kms-poc を workers.dev へデプロイして公開内容を照合（--jwks rsa,ec / --dry-run / --check-only）"
run = "pnpm tsx scripts/poc/admin-kms/deploy.ts"

[tasks."poc:admin-kms:access-key"]
description = "PoC N6: Worker 用の IAM ユーザーのアクセスキーを作って Worker の secret に入れる（-- create）か、すべて消す（-- delete）"
run = "pnpm tsx scripts/poc/admin-kms/access-key.ts"

[tasks."poc:admin-kms:run"]
description = "PoC N6: Worker の /poc/login（KMS で署名 → STS → getSigninToken）か /poc/sign（KMS の Sign だけ）を呼び、所要時間を集計（--mode login|sign --key rsa|ec|rsa-next --n 10）"
run = "pnpm tsx scripts/poc/admin-kms/run.ts"

[tasks."poc:admin-kms:disable-watch"]
description = "PoC N6 K4: 1 秒おきに Sign を呼びながら鍵を DisableKey し、発行が止まるまでの時間を測る（そのあと EnableKey で戻す。--key rsa）"
run = "pnpm tsx scripts/poc/admin-kms/disable-watch.ts"

[tasks."poc:admin-kms:trail"]
description = "PoC N6 K4: CloudTrail の Sign・DisableKey・EnableKey・AssumeRoleWithWebIdentity を平らにして出し、Sign と突き合わせる（--since ISO。値は伏せる）"
run = "pnpm tsx scripts/poc/admin-kms/trail.ts"

[tasks."poc:admin-kms:destroy"]
description = "PoC N6: アクセスキー → スタック（鍵は 7 日後の削除の予約）→ Worker の順に消し、鍵の削除予定日を出す"
run = "bash scripts/poc/admin-kms/destroy.sh"
